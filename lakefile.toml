name = "Sqier"
defaultTargets = ["Squier", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Squier"
globs = ["Squier", "Squier.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

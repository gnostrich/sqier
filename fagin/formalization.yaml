# formalization.yaml v0.4. Third Palomar entry from this repository (Fagin's zero-one law).
# Comparator configuration: comparator-fagin.json.
version: "v0.4"

project:
  name: "Fagin's zero-one law: every first-order sentence about graphs holds in G(n, 1/2) with probability tending to 0 or 1, and the limit is 1 exactly when the Rado graph satisfies it"
  description: >-
    For a first-order sentence phi in Mathlib's language of graphs, let
    graphProb phi n be the proportion of the 2^(n choose 2) labelled simple
    graphs on n vertices that satisfy phi, i.e. the probability that the
    Erdős–Rényi random graph G(n, 1/2) satisfies phi. This entry proves in
    Lean 4 and Mathlib the zero-one law of Glebskii, Kogan, Liogon'kii and
    Talanov (1969) and Fagin (1976): graphProb phi n tends to 0 or to 1. It
    proves the sharper form that the limit is 1 exactly when the Rado graph
    satisfies phi, so the almost-sure theory of finite graphs is the
    complete theory of the Rado graph. Seven statements are compared.

    (1) There are 2^(n choose 2) simple graphs on Fin n, so graphProb is a
    probability. (2) For each k, the proportion of graphs on n vertices
    with the k-extension property tends to 1: for disjoint vertex sets A, B
    with |A| + |B| <= k some vertex outside A and B is adjacent to all of A
    and none of B. The proof is a union bound over the pairs (A, B) with
    independence of disjoint sets of edges, giving failure probability at
    most a polynomial in n times a geometric factor. (3) The Rado graph,
    on the natural numbers with i ~ j iff bit min(i, j) of max(i, j) is 1,
    has every extension property. (4) Any two countable graphs with every
    extension property are isomorphic, by a back-and-forth construction.
    (5)-(6) If the Rado graph satisfies phi then graphProb phi n -> 1, and
    otherwise graphProb phi n -> 0. (7) The zero-one law.

    The proof of (5)-(6) is the classical one. First-order extension
    sentences axiomatize, with the axioms of simple graphs, a theory T whose
    models are the graphs with every extension property. T is satisfiable
    (the Rado graph), has no finite models, and is aleph-0-categorical by
    (4), so it is complete by Mathlib's Łoś–Vaught test. If the Rado graph
    satisfies phi, then T proves phi, and by Mathlib's compactness theorem
    finitely many extension properties already force phi; (2) then gives
    probability tending to 1. Otherwise T proves the negation of phi. The
    results are classical. SEARCHSENTENCE
  authors:
    - "Rohan Badade"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Rohan Badade"

classification:

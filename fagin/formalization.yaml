  - title: "mathlib4: the Lean mathematical library"
    authors:
      - "The Mathlib Community"
    id: "https://github.com/leanprover-community/mathlib4"
    type: other
    location: "Mathlib v4.35.0, as pinned by lakefile.toml and lake-manifest.json"
    relationship: background
    license: "Apache-2.0"
    author_endorsement: "n/a"
    note: >-
      The ambient library. ChallengeFagin.lean imports only Mathlib, which
      supplies first-order logic and the language of graphs, the compactness
      theorem, the Łoś–Vaught test (Cardinal.Categorical.isComplete), simple
      graphs and their isomorphisms, and real limits. Mathlib has no
      extension axioms, Rado graph or zero-one law; these are developed here.

related_formalizations: []

status:
  scope: >-
    Formalized: exactly the seven statements listed in comparator-fagin.json
    and stated in ChallengeFagin.lean, with sorry-free proofs in Fagin/. All
    are unconditional.

    Not claimed. Edge probabilities other than 1/2 (or p = p(n)); vocabularies
    other than a single symmetric irreflexive relation (Fagin's general
    form); decidability of the limit (the theory is complete and
    recursively axiomatized, but computability is not stated); monadic
    second-order or other logics; rates of convergence beyond those implicit
    in the proof. The results are classical; priority among formalizations
    is unknown. Proof terms were not reviewed line by line by a human; see
    the review block.

    Sorry and native_decide. The development is sorry-free and
    native_decide-free, and the compared theorems depend only on propext,
    Classical.choice and Quot.sound. ChallengeFagin.lean's seven deliberate
    sorries are the comparator placeholders and are not counted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        From the author's brief, Claude (Anthropic) fixed the definitions and
        Lean statements, wrote ChallengeFagin.lean, SolutionFagin.lean,
        comparator-fagin.json and this file, and checked the statement
        surface with lake comparator against sorried interfaces. Three
        parallel Claude agents wrote the proofs (the counting bound for
        extension properties; the Rado graph and back and forth; extension
        sentences, completeness by Łoś–Vaught and compactness) by iterating
        against the Lean compiler on the pinned toolchain. A separate agent
        searched for earlier formalizations and checked the bibliographic
        data.
      cost:
        wall_time: "about one hour"
        spend_usd: "not tracked"
        hardware: "cloud container, 4 cores"
      prompting_notes: >-
        Work was posed as written targets with fixed signatures, a short
        mathematical route per agent, and the axiom budget (propext,
        Quot.sound, Classical.choice only; no sorry, no native_decide).
    - method: manual
      models: []
      framework: "n/a"
      tool_setup: >-
        The human author chose the target (asymptotic laws of truth on
        finite structures), wrote the brief with the statement and proof
        route, and takes responsibility for all claims.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human conception and brief; AI-designed statements and AI-written Lean
    proofs (Claude). No human has reviewed the proof terms line by line. The
    trust model is Lean's kernel plus the axiom audit and the comparator
    check described under review.

fidelity:
  divergences: >-
    Between the repository and ChallengeFagin.lean, which is what Palomar
    compares: ChallengeFagin.lean imports only Mathlib and contains verbatim
    copies of the three definitions in Fagin/Defs.lean (graphProb,
    ExtensionProperty, radoGraph), in the namespace Fagin; the statements are
    in the namespace FaginChallenge. There are no individual statement
    deviations.

    Against the sources: the random graph G(n, 1/2) is represented by the
    uniform count over labelled simple graphs on Fin n (no probability
    measure is used; the two are the same distribution). Sentences are those
    of Mathlib's first-order language of graphs, a single binary relation
    symbol, interpreted in a simple graph as adjacency; Fagin's theorem for
    arbitrary finite relational vocabularies is not stated. The k-extension
    property is stated for finite sets A, B with |A| + |B| <= k rather than
    as a family of first-order axioms; the first-order extension sentences
    appear only inside the proof. The limit statement is given as two
    theorems (limit 1 if the Rado graph satisfies phi, limit 0 otherwise).

review:
  status: >-
    self-assessed; automated mechanical checks (lake build with sorry
    census; lake comparator from the pinned Lean v4.35.0 toolchain with
    statement match and replay through Lean's kernel, NanoDa and con-ron);
    no line-by-line human review of proof terms; no external mathematical
    peer review
  reviewers:
    - "Rohan Badade (self)"
  notes: >-
    Checked mechanically: lake build with no sorry warnings and no errors;
    #print axioms on every compared theorem (propext, Classical.choice,
    Quot.sound); and lake comparator with comparator-fagin.json against
    ChallengeFagin.lean, covering statement match, definition identity, the
    axiom allowlist and kernel replay. Checked by a human: the choice of
    statements and this file. Not done: line-by-line human reading of proof
    terms; external mathematical review.

alignment:
  namespace: "FaginChallenge"
  statements:
    - source: "Number of labelled graphs (standard)"
      lean: "FaginChallenge.card_simpleGraph"
      module: "ChallengeFagin"
      status: proved
      note: "There are 2^(n choose 2) simple graphs on Fin n. Proved as Fagin.card_simpleGraph."
    - source: "Extension axioms hold almost surely (Fagin 1976; Glebskii et al. 1969)"
      lean: "FaginChallenge.extension_almost_sure"
      module: "ChallengeFagin"
      status: proved
      note: "For each k, the proportion of graphs on n vertices with the k-extension property tends to 1. Proved as Fagin.extension_almost_sure."
    - source: "The Rado graph has the extension property (Rado 1964)"
      lean: "FaginChallenge.radoGraph_extension"
      module: "ChallengeFagin"
      status: proved
      note: "Proved as Fagin.radoGraph_extension."
    - source: "Uniqueness of the countable random graph (back and forth; see Cameron)"
      lean: "FaginChallenge.nonempty_iso_of_extension"
      module: "ChallengeFagin"
      status: proved
      note: "Any two countable graphs with every extension property are isomorphic. Proved as Fagin.nonempty_iso_of_extension."
    - source: "The almost-sure theory of graphs is the theory of the Rado graph"
      lean: "FaginChallenge.tendsto_one_of_rado"
      module: "ChallengeFagin"
      status: proved
      note: "If the Rado graph satisfies phi, graphProb phi n -> 1. Proved as Fagin.tendsto_one_of_rado."
    - source: "The almost-sure theory of graphs is the theory of the Rado graph"
      lean: "FaginChallenge.tendsto_zero_of_not_rado"
      module: "ChallengeFagin"
      status: proved
      note: "If the Rado graph does not satisfy phi, graphProb phi n -> 0. Proved as Fagin.tendsto_zero_of_not_rado."
    - source: "Zero-one law (Glebskii–Kogan–Liogon'kii–Talanov 1969; Fagin 1976)"
      lean: "FaginChallenge.zero_one_law"
      module: "ChallengeFagin"
      status: proved
      note: "graphProb phi n tends to 0 or to 1. Proved as Fagin.zero_one_law."


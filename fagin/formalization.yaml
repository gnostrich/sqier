    authors:
      - "Ronald Fagin"
    id: "FAGINID"
    type: paper
    location: "FAGINLOC"
    relationship: formalizes
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      The zero-one law for first-order sentences, result (7), in the case of
      graphs with edge probability 1/2, and its proof through extension
      axioms and a complete aleph-0-categorical theory, results (2)-(6).
      Fagin's general form (any finite relational vocabulary) and other
      edge probabilities are not formalized.
  - title: "Range and degree of realizability of formulas in the restricted predicate calculus"
    authors:
      - "Y. V. Glebskii"
      - "D. I. Kogan"
      - "M. I. Liogon'kii"
      - "V. A. Talanov"
    id: "GKLTID"

    type: other
    location: "Mathlib v4.35.0, as pinned by lakefile.toml and lake-manifest.json"
    relationship: background
    license: "Apache-2.0"
    author_endorsement: "n/a"
    note: >-
      The ambient library. Challenge.lean imports only Mathlib, which
      supplies lists, finite sets, well-foundedness and the
      reflexive-transitive closure and join of a relation. Mathlib has no
      general Newman's lemma, no critical pairs and no string rewriting
      theory; these are developed here.

related_formalizations:
  - id: "https://bitbucket.org/fplab/confluencecoherence"
    relationship: independent
    note: >-
      Kraus and von Raumer, "A rewriting coherence theorem with applications
      in homotopy type theory", Mathematical Structures in Computer Science
      32(7) (2022), 982-1014, doi:10.1017/S0960129523000026, formalized in
      Agda. It proves an abstract coherence theorem (a terminating
      generalised 2-polygraph, closed under congruence and cancelling
      inverses, with a Winkler–Buchberger structure, has a homotopy basis),
      a relative of Squier's theorem for abstract rewriting. It has no
      critical pairs of string rewriting systems and no finite derivation
      type. No code is shared.
  - id: "https://github.com/leanprover/cslib"
    relationship: independent
    note: >-
      CSLib (Lean 4) contains Newman's lemma for abstract relations
      (Cslib/Foundations/Relation/Confluence.lean), an earlier Lean proof
      of result (1). Not used here.
  - id: "https://www.isa-afp.org/entries/First_Order_Rewriting.html"
    relationship: independent
    note: >-
      The Isabelle AFP (Abstract Rewriting; First-Order Rewriting, from
      IsaFoR) contains Newman's lemma and the critical pair lemma for term
      rewriting. Kim (ITP 2025, LIPIcs.ITP.2025.10) proves a critical pair
      lemma for semi-Thue systems in Isabelle. These are earlier proofs of
      results of the kind of (1)-(3), in other systems; neither contains
      homotopy bases or finite derivation type.
  - id: "PALOMAR-2026-09-01-000010"
    relationship: other
    note: >-
      Thematic link only (confluence certificates via decreasing diagrams);
      no code, definition or statement is shared.

status:
  scope: >-
    Formalized: exactly the nine statements listed in comparator.json and
    stated in Challenge.lean, with sorry-free proofs in Squier/. All are
    unconditional. The setting is string rewriting: rules are a Finset of
    pairs of lists over an arbitrary alphabet, which must be finite only
    in (4) and (6).

    Not claimed. Tietze invariance (finite derivation type is a property of
    the monoid, independent of the finite presentation); Squier's
    counterexample monoid (finitely presented, decidable word problem, not
    of finite derivation type, hence with no finite convergent
    presentation); homological finiteness (FP3) and its relation to finite
    derivation type; general polygraphs and higher-dimensional
    coherence; Knuth–Bendix completion. Decidability of critical pairs
    is shown only through their finiteness and the worked example. The
    results are classical; we searched for an earlier machine-checked proof
    of Squier's theorem and found none, but priority is unknown. Newman's
    lemma and the critical pair lemma were formalized before (see
    related_formalizations). Proof terms were not reviewed line by line by
    a human; see the review block.

    Sorry and native_decide. The development is sorry-free and
    native_decide-free, and the compared theorems depend only on propext,
    Classical.choice and Quot.sound. Challenge.lean's nine deliberate
    sorries are the comparator placeholders and are not counted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        From the author's brief, Claude (Anthropic) designed the
        definitions and fixed the Lean statements, wrote Challenge.lean,
        Solution.lean, comparator.json and this file, and checked the
        statement surface with lake comparator against sorried interfaces.
        Parallel Claude agents, one per module (Newman and the critical pair
        lemma; the classification of branchings and finiteness; the path
        algebra and Squier's theorem; the S3 example), wrote the proofs by
        iterating against the Lean compiler on the pinned toolchain. A
        separate agent searched for earlier formalizations and checked the
        bibliographic data.
      cost:
        wall_time: "WALLTIME"
        spend_usd: "not tracked"
        hardware: "cloud container, 4 cores"
      prompting_notes: >-
        Work was posed as written targets with fixed signatures, a short
        mathematical route per agent, and the axiom budget (propext,
        Quot.sound, Classical.choice only; no sorry, no native_decide).
    - method: manual
      models: []
      framework: "n/a"
      tool_setup: >-
        The human author chose the target (Squier's theorem as the geometry
        of the space of permitted moves), wrote the brief with the
        statements, the worked example and the design checks, and takes
        responsibility for all claims.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human conception and brief; AI-designed definitions and statements and
    AI-written Lean proofs (Claude). No human has reviewed the proof terms
    line by line. The trust model is Lean's kernel plus the axiom audit and
    the comparator check described under review.

fidelity:
  divergences: >-
    Between the repository and Challenge.lean, which is what Palomar
    compares: Challenge.lean imports only Mathlib and contains verbatim
    copies of all definitions in Squier/Defs.lean (namespace Squier); the
    statements are in the namespace SquierChallenge. There are no
    individual statement deviations.

    Against the sources: Squier and Guiraud–Malbos define homotopy as a
    congruence on the 2-cells of the free (2,1)-category generated by the
    rewriting system, where the exchange law is built in. Here the 2-cells
    are zig-zag paths of rewriting steps (lists of steps, each forwards or
    backwards), and the homotopy relation is generated explicitly by the
    given cells, the independence squares (which play the role of the
    exchange law), and the cancellation of a step against its inverse, as
    a relation closed under equivalence, concatenation, inversion and
    whiskering. This follows Squier's own formulation as Guiraud and
    Malbos describe it (Introduction, "Finite derivation type"): rewriting
    steps in both directions, with the squares of independent rewrites
    filled, which Guiraud and Malbos identify with the exchange relations
    of the (2,1)-category. The equivalence of the two formulations is not
    formalized. A family of generating confluences
    (exactly one cell per critical branching) is generalized to any set
    of cells containing at least one resolution cell for each critical
    branching, in either orientation; this includes every family of
    generating confluences. In (5) convergence is weakened to termination,
    since resolving every critical branching implies confluence. Finite
    derivation type in (6) is stated for the given system; its invariance
    under change of finite presentation is not stated. Critical branchings
    are ordered pairs (both orders of each critical pair occur), defined
    structurally: distinct, not independent, and with no common nonempty
    left or right context.

review:
  status: >-
    self-assessed; automated mechanical checks in this repository's CI
    (lake build with sorry census; lake comparator from the pinned Lean
    v4.35.0 toolchain with statement match and replay through Lean's
    kernel, NanoDa and con-ron); no line-by-line human review of proof
    terms; no external mathematical peer review
  reviewers:
    - "Rohan Badade (self)"
  notes: >-
    Checked mechanically: lake build on the pinned toolchain with no sorry
    warnings and no errors; #print axioms on every compared theorem
    (propext, Classical.choice, Quot.sound); and the toolchain's lake
    comparator with comparator.json against Challenge.lean, covering
    statement match, definition identity, the axiom allowlist and kernel
    replay. These repository checks are distinct from Palomar's own
    verification. The five S3 cells were checked by hand against the
    critical pairs before formalization and are verified in Lean. Checked
    by a human: the choice of statements and this file. Not done:
    line-by-line human reading of proof terms; external mathematical
    review.

alignment:
  namespace: "SquierChallenge"
  statements:
    - source: "Newman (1942), Theorem 3; Guiraud–Malbos (2018), Theorem 3.1.6"
      lean: "SquierChallenge.newman"
      module: "Challenge"
      status: proved
      note: "Terminating and locally confluent implies confluent, for an arbitrary relation. Proved as Squier.newman."
    - source: "Critical pair lemma; Guiraud–Malbos (2018), Lemma 3.1.5"
      lean: "SquierChallenge.critical_pair_lemma"
      module: "Challenge"
      status: proved
      note: "A string rewriting system is locally confluent iff every critical branching is joinable. Proved as Squier.critical_pair_lemma."
    - source: "Newman's lemma with the critical pair lemma (Knuth–Bendix criterion for string rewriting)"
      lean: "SquierChallenge.confluent_iff_criticalPairs_joinable"
      module: "Challenge"
      status: proved
      note: "A terminating system is confluent iff every critical branching is joinable. Proved as Squier.confluent_iff_criticalPairs_joinable."
    - source: "Finiteness of critical pairs of a finite system (standard)"
      lean: "SquierChallenge.criticalBranchings_finite"
      module: "Challenge"
      status: proved
      note: "Over a finite alphabet, a finite system has finitely many critical branchings. Proved as Squier.criticalBranchings_finite."
    - source: "Squier–Otto–Kobayashi (1994), Theorem 5.2; Guiraud–Malbos (2018), Theorem 4.3.2"
      lean: "SquierChallenge.squier_homotopy_basis"
      module: "Challenge"
      status: proved
      note: "For a terminating system, every set of cells containing a resolution cell for each critical branching is a homotopy basis (convergence weakened to termination; see fidelity). Proved as Squier.squier_homotopy_basis."
    - source: "Squier–Otto–Kobayashi (1994), Theorem 5.3; Guiraud–Malbos (2018), Theorem 4.3.3"
      lean: "SquierChallenge.squier_finiteDerivationType"
      module: "Challenge"
      status: proved
      note: "A finite convergent system over a finite alphabet has finite derivation type. Proved as Squier.squier_finiteDerivationType."
    - source: "Sanity check of the definitions (not from a source)"
      lean: "SquierChallenge.homotopy_nondegenerate"
      module: "Challenge"
      status: proved
      note: "With no cells, the two rewrites aaa -> a of the S3 system are not homotopic, so the homotopy relation is not trivial. Proved as Squier.homotopy_nondegenerate."
    - source: "Worked example: the Coxeter presentation of S3"
      lean: "SquierChallenge.s3_convergent"
      module: "Challenge"
      status: proved
      note: "The system aa -> e, bb -> e, bab -> aba is terminating and confluent. Proved as Squier.s3_convergent."
    - source: "Worked example: a homotopy basis of S3 from its critical pairs"
      lean: "SquierChallenge.s3_homotopy_basis"
      module: "Challenge"
      status: proved
      note: "The five critical-pair cells (overlaps aaa, bbb, bbab, babb, babab) form a homotopy basis. Proved as Squier.s3_homotopy_basis."


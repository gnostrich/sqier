# formalization.yaml v0.4. Comparator configuration: comparator.json.
version: "v0.4"

project:
  name: "Squier's theorem: finite convergent string rewriting systems have finite derivation type, with Newman's lemma, the critical pair lemma and the symmetric group S3 as a worked example"
  description: >-
    A string rewriting system is a finite set of rules l -> r between words.
    Its derivation graph has the words as vertices and the rewriting steps
    x l y -> x r y as edges. This entry proves in Lean 4 and Mathlib
    Squier's theorem: for a terminating system, one resolution cell per
    critical pair generates every homotopy between parallel zig-zag paths
    of derivations. Hence a finite convergent system over a finite alphabet
    has finite derivation type (Squier, Otto and Kobayashi 1994). Nine
    statements are compared.

    Homotopy modulo a set B of 2-cells (pairs of parallel paths) is the
    smallest relation on parallel paths that contains B and the
    independence squares (two steps rewriting disjoint factors commute),
    identifies a step followed by its inverse, in either order, with the
    empty path, is an equivalence relation, and is compatible with
    concatenation, inversion and whiskering by contexts x _ y. B is a
    homotopy basis if any two parallel paths are homotopic modulo B. A
    system has finite derivation type if it has a finite homotopy basis.
    A critical branching is a pair of distinct, non-independent steps from
    a common word with minimal context, that is, an overlap or an inclusion
    of two left-hand sides.

    (1) Newman's lemma for an arbitrary relation: terminating and locally
    confluent implies confluent. (2) The critical pair lemma for string
    rewriting: a system is locally confluent if and only if every critical
    branching is joinable. (3) Hence a terminating system is confluent if
    and only if its critical branchings are joinable. (4) Over a finite
    alphabet, a finite system has finitely many critical branchings.
    (5) Squier's theorem in homotopy-basis form: for a terminating system,
    every set of cells containing, for each critical branching, a cell
    formed by the branching and some resolution of it (in either
    orientation) is a homotopy basis. The resolutions are arbitrary, so
    every choice of one resolution per critical pair gives a homotopy
    basis. (6) Squier's theorem: a finite convergent system over a finite
    alphabet has finite derivation type. (7) Non-degeneracy: the homotopy
    relation does not identify everything. For the system aa -> e,
    bb -> e, bab -> aba and no cells, the two one-step rewrites aaa -> a
    are not homotopic, which a parity-weighted count of aa-steps detects.
    (8)-(9) That system, a complete presentation of the symmetric group
    S3 = <a, b | a^2 = b^2 = 1, bab = aba>, is terminating and confluent,
    and its five explicit critical-pair cells form a homotopy basis.

    The proof of (5) follows Squier and Guiraud–Malbos. Normal-form paths
    are chosen by well-founded recursion. A noetherian induction then
    shows that every step followed by the normal-form path of its target
    is homotopic to the normal-form path of its source, resolving each
    local branching as an independence square, a trivial branching, or a
    whiskered critical cell. All results are classical. We searched for a
    previous machine-checked proof of Squier's theorem (November 2026) and
    found none; priority among formalizations is nevertheless unknown.
  authors:
    - "Rohan Badade"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Rohan Badade"

classification:
  arxiv: ["math.CT", "cs.LO"]
  msc2020: ["68Q42", "20M05", "18N30", "68V20"]

sources:
  - title: "A finiteness condition for rewriting systems"
    authors:
      - "Craig C. Squier"
      - "Friedrich Otto"
      - "Yuji Kobayashi"
    id: "doi:10.1016/0304-3975(94)90175-9"
    type: paper
    location: "Theoretical Computer Science 131(2) (1994), 271-294; Theorem 5.2 (critical-pair cells form a homotopy basis) and Theorem 5.3 (finite convergent presentations have finite derivation type), theorem numbers as cited by Guiraud and Malbos (2018). The original was not consulted directly."
    relationship: formalizes
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      The entry formalizes Squier's theorem for string rewriting systems,
      results (5) and (6), in the homotopical formulation, with homotopy
      defined on zig-zag paths of the derivation graph (see fidelity).
      Tietze invariance of finite derivation type (Theorem 4.3 there, as
      cited by Guiraud and Malbos) and Squier's counterexample monoid
      (Theorem 6.7 and Corollary 6.8 there) are not formalized.
  - title: "Polygraphs of finite derivation type"
    authors:
      - "Yves Guiraud"
      - "Philippe Malbos"
    id: "doi:10.1017/S0960129516000220"
    type: paper
    location: "Mathematical Structures in Computer Science 28(2) (2018), 155-201; arXiv:1402.2587. Lemma 3.1.5 (critical branching lemma), Theorem 3.1.6 (Newman's lemma), Section 4.1 (homotopy bases, finite derivation type), Theorems 4.3.2 and 4.3.3 (Squier's theorems)."
    relationship: formalizes
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      The blueprint followed: the definitions of critical branchings,
      homotopy bases and finite derivation type, and the proof of Theorem
      4.3.2 by normal-form paths and noetherian induction. The entry treats
      the case of string rewriting systems (2-polygraphs with one 0-cell),
      not general polygraphs.
  - title: "On theories with a combinatorial definition of \"equivalence\""
    authors:
      - "M. H. A. Newman"
    id: "doi:10.2307/1968867"
    type: paper
    location: "Annals of Mathematics (2) 43(2) (1942), 223-243; Theorem 3"
    relationship: formalizes
    license: "unknown"
    author_endorsement: "n/a"
    note: "Result (1), Newman's lemma, in the abstract form for an arbitrary relation."
  - title: "Simple word problems in universal algebras"
    authors:
      - "Donald E. Knuth"
      - "Peter B. Bendix"
    id: "doi:10.1016/B978-0-08-012975-4.50028-X"
    type: paper
    location: "Computational Problems in Abstract Algebra (J. Leech, ed.), Pergamon, 1970, 263-297"
    relationship: background
    license: "unknown"
    author_endorsement: "n/a"

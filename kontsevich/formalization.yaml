# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Third Palomar entry from this repository (graph hypersurfaces).
# Comparator configuration: comparator-kontsevich.json.
version: "v0.4"

project:
  name: "Point counts of graph hypersurfaces: Kontsevich's polynomiality holds for every series–parallel graph, with the series–parallel rules for the graph and 2-forest polynomials and the exact counts for banana graphs and K4"
  description: >-
    The graph polynomial (Kirchhoff polynomial, first Symanzik polynomial)
    of a finite multigraph is Psi = sum over spanning trees T of the product
    of the edge variables alpha_e for e not in T. Its zero set, the graph
    hypersurface, carries the Feynman periods of the graph, and Kontsevich
    asked whether its number of points over a finite field with q elements
    is always a polynomial in q. This is false in general (Belkale–Brosnan
    2003; explicit counterexamples have 14 edges) but true for small graphs.
    This entry proves in Lean 4 and Mathlib that it holds for every
    series–parallel graph, together with the combinatorial rules behind it
    and exact counts for two families. Seven statements are compared.

    (1)-(4) Series and parallel rules. For two-terminal multigraphs, let Phi
    be the 2-forest polynomial (sum over spanning 2-forests separating the
    terminals of the product of the variables of the edges outside the
    forest). Under series composition Psi = Psi1 Psi2 and
    Phi = Phi1 Psi2 + Psi1 Phi2; under parallel composition
    Psi = Psi1 Phi2 + Phi1 Psi2 and Phi = Phi1 Phi2, with the two edge sets
    disjoint. (In the electrical reading, with alpha_e the resistance of
    edge e, Phi/Psi is the effective resistance between the terminals.)
    (5) For every series–parallel graph (built from single edges by series
    and parallel composition) there is a single integer polynomial P such
    that, for every finite field with q elements, the affine graph
    hypersurface {a : Psi(a) = 0} has exactly P(q) points. (6) For the
    banana graph with m parallel edges (Psi = e_(m-1)) the count is
    q^m - (q-1)^m - m(q-1)^(m-1) + ((q-1)^m + (-1)^m (q-1))/q, stated
    multiplied by q. (7) For K4, the smallest graph that is not
    series–parallel, the count is q^2 (q^3 + q - 1).

    The proof of (5) tracks four counts per graph: the points where Psi and
    Phi both vanish, only Psi vanishes, only Phi vanishes, and neither
    vanishes. Psi and Phi are homogeneous of consecutive degrees, so
    scaling all variables by a nonzero constant scales the ratio Phi/Psi by
    that constant; hence on the last set the ratio is equidistributed over
    the nonzero field elements. With this the four counts of a series or
    parallel composition are explicit polynomial functions of the counts of
    the parts, and induction gives (5). The count (7) is proved by
    eliminating one variable at a time, using that Psi is linear in each
    variable.

    The results are known in substance: polynomiality for series–parallel
    graphs follows from Stembridge's reductions (1998) and is stated by
    Brown and Schnetz (2012), citing Aluffi and Marcolli; the banana and K4
    counts are classical. We did not find the (Psi, Phi) series–parallel
    rules or the equidistribution argument stated in this form in the
    literature. We searched Mathlib (source and pull requests), other Lean
    repositories via GitHub code search, the Isabelle AFP, Coq/Rocq, HOL,
    Agda, Mizar and the Palomar registry (November 2026) and found no
    earlier formalization of graph hypersurfaces or of Kontsevich's
    question; priority is nevertheless unknown.
  authors:
    - "Rohan Badade"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Rohan Badade"

classification:
  arxiv: ["math.CO", "math.AG"]
  msc2020: ["05C31", "14G15", "81T18", "05C30"]

sources:
  - title: "Counting points on varieties over finite fields related to a conjecture of Kontsevich"
    authors:
      - "John R. Stembridge"
    id: "doi:10.1007/BF01608531"
    type: paper
    location: "Annals of Combinatorics 2(4) (1998), 365-385; reductions for loops, parallel edges, cut vertices and 2-edge cuts (Section 2)"
    relationship: independently-proves
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      Stembridge's reductions imply polynomiality for series–parallel graphs
      (they are closed under the minors produced by the reductions). The
      entry proves this independently, by a different route (the (Psi, Phi)
      rules and the four-count recursion), and in the Kirchhoff convention
      Psi = sum over trees of the product over edges outside the tree.
  - title: "A K3 in phi^4"
    authors:
      - "Francis Brown"
      - "Oliver Schnetz"
    id: "doi:10.1215/00127094-1644201"
    type: paper
    location: "Duke Mathematical Journal 161(10) (2012), 1817-1862; Section 3.1 (series–parallel reductions; polynomial classes for series–parallel graphs); arXiv:1006.4064"
    relationship: independently-proves
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      States that iterating the reductions gives polynomial formulae for
      series–parallel graphs, result (5); also the source of the K4 count
      in the wheel family and of the 14-edge counterexamples that the entry
      does not treat.
  - title: "Feynman motives and deletion-contraction relations"
    authors:
      - "Paolo Aluffi"
      - "Matilde Marcolli"
    id: "doi:10.1090/conm/538/10594"
    type: paper
    location: "Contemporary Mathematics 538 (2011), 21-64; Corollary 5.6 (banana graphs)"
    relationship: independently-proves
    license: "unknown"
    author_endorsement: not-contacted
    note: "The class of the banana graph hypersurface, result (6), proved independently here by counting."
  - title: "Matroids, motives, and a conjecture of Kontsevich"
    authors:
      - "Prakash Belkale"
      - "Patrick Brosnan"
    id: "doi:10.1215/S0012-7094-03-11615-4"
    type: paper
    location: "Duke Mathematical Journal 116(1) (2003), 147-188"
    relationship: background
    license: "unknown"
    author_endorsement: "n/a"
    note: "Disproves Kontsevich's conjecture in general; context for the scope of result (5). Not formalized."
  - title: "On motives associated to graph polynomials"
    authors:
      - "Spencer Bloch"
      - "Hélène Esnault"
      - "Dirk Kreimer"
    id: "doi:10.1007/s00220-006-0040-2"

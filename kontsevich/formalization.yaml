status:
  scope: >-
    Formalized: exactly the seven statements listed in
    comparator-kontsevich.json and stated in ChallengeKontsevich.lean, with
    sorry-free proofs in Kontsevich/. All are unconditional apart from the
    stated distinct-terminal hypotheses in (2)-(4).

    Not claimed. Projective point counts (the affine and projective counts
    determine each other for homogeneous Psi, but this is not stated);
    Grothendieck classes or motives; graphs beyond series–parallel graphs
    other than K4 (wheels, Delta–Y reducible graphs); the counterexamples
    to Kontsevich's conjecture; the c2 invariant; Feynman periods. The
    hypotheses G.src != G.tgt in forest_series and forest_parallel are not
    all needed by the proofs but are kept as stated. The results are known
    in substance (see sources); priority among formalizations is unknown.
    Proof terms were not reviewed line by line by a human; see the review
    block.

    Sorry and native_decide. The development is sorry-free and
    native_decide-free, and the compared theorems depend only on propext,
    Classical.choice and Quot.sound. ChallengeKontsevich.lean's seven
    deliberate sorries are the comparator placeholders and are not counted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        From the author's direction, Claude (Anthropic) designed the
        definitions and statements, derived the (Psi, Phi) rules and the
        four-count recursion and checked them numerically (exhaustive counts
        over F_2, F_3, F_5 against brute force, and the banana and K4 counts
        against the literature), wrote ChallengeKontsevich.lean,
        SolutionKontsevich.lean, comparator-kontsevich.json and this file,
        and checked the statement surface with lake comparator against
        sorried interfaces. Four parallel Claude agents wrote the proofs
        (the series and parallel rules; the series–parallel count; the
        banana count; the K4 count) by iterating against the Lean compiler.
        Separate agents searched the literature and checked bibliographic
        data.
      cost:
        wall_time: "about three hours"
        spend_usd: "not tracked"
        hardware: "cloud container, 4 cores"
      prompting_notes: >-
        Work was posed as written targets with fixed signatures, a short
        mathematical route per agent, and the axiom budget (propext,
        Quot.sound, Classical.choice only; no sorry, no native_decide).
    - method: manual
      models: []
      framework: "n/a"
      tool_setup: >-
        The human author chose the direction (the bridge from graphs and
        electrical networks to graph hypersurfaces and motives) and takes
        responsibility for all claims.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human direction; AI-designed statements and AI-written Lean proofs
    (Claude). No human has reviewed the proof terms line by line. The trust
    model is Lean's kernel plus the axiom audit and the comparator check
    described under review.

fidelity:
  divergences: >-
    Between the repository and ChallengeKontsevich.lean, which is what
    Palomar compares: ChallengeKontsevich.lean imports only Mathlib and
    contains verbatim copies of the definitions in Kontsevich/Defs.lean; the
    statements are in the namespace KontsevichChallenge. There are no
    individual statement deviations.

    Against the sources: the graph polynomial is in Kontsevich's convention
    (product over edges outside the tree), as in Belkale–Brosnan,
    Aluffi–Marcolli and Brown–Schnetz; Stembridge uses the complementary
    convention. Point counts are affine counts in F^E. Multigraphs may have
    parallel edges and loops; spanning trees and 2-forests are defined by
    edge counts and connectivity. Series–parallel graphs are the
    two-terminal graphs generated from a single edge by series and parallel
    composition (as an inductive type of terms), rather than defined by an
    excluded minor. Polynomiality is stated as one integer polynomial valid
    for all finite fields.

review:
  status: >-
    self-assessed; repository-level mechanical checks only (lake build
    with a sorry census, #print axioms, and lake comparator with replay
    through Lean's kernel, run locally and in this repository's CI). These
    are distinct from Palomar's own verification, whose independent kernel
    replays are separately pinned by Palomar and are not described here. No
    line-by-line human review of proof terms; no external mathematical peer
    review
  reviewers:
    - "Rohan Badade (self)"
  notes: >-
    Checked mechanically: lake build with no sorry warnings and no errors;
    #print axioms on every compared theorem (propext, Classical.choice,
    Quot.sound); and lake comparator with comparator-kontsevich.json against
    ChallengeKontsevich.lean, covering statement match, definition identity,
    the axiom allowlist and replay through Lean's kernel. These repository
    checks are distinct from Palomar's verification. Checked numerically before
    formalization: the series and parallel count recursion against
    exhaustive counts over F_2, F_3 and F_5 for small graphs, the banana
    counts and the K4 counts (36, 261, 3225 at q = 2, 3, 5). Not done:
    line-by-line human reading of proof terms; external mathematical review.

alignment:
  namespace: "KontsevichChallenge"
  statements:
    - source: "Series rule for the graph polynomial (spanning trees of a one-point union)"
      lean: "KontsevichChallenge.kirchhoff_series"
      module: "ChallengeKontsevich"
      status: proved
      note: "Psi(G ; H) = Psi(G) Psi(H). Proved as Kontsevich.kirchhoff_series."
    - source: "Series rule for the 2-forest polynomial"
      lean: "KontsevichChallenge.forest_series"
      module: "ChallengeKontsevich"
      status: proved
      note: "Phi(G ; H) = Phi(G) Psi(H) + Psi(G) Phi(H). Proved as Kontsevich.forest_series."
    - source: "Parallel rule for the graph polynomial"
      lean: "KontsevichChallenge.kirchhoff_parallel"
      module: "ChallengeKontsevich"
      status: proved
      note: "Psi(G || H) = Psi(G) Phi(H) + Phi(G) Psi(H). Proved as Kontsevich.kirchhoff_parallel."
    - source: "Parallel rule for the 2-forest polynomial"
      lean: "KontsevichChallenge.forest_parallel"
      module: "ChallengeKontsevich"
      status: proved
      note: "Phi(G || H) = Phi(G) Phi(H). Proved as Kontsevich.forest_parallel."
    - source: "Kontsevich's conjecture for series–parallel graphs (cf. Stembridge 1998; Brown–Schnetz 2012, Section 3.1)"
      lean: "KontsevichChallenge.kontsevich_seriesParallel"
      module: "ChallengeKontsevich"
      status: proved
      note: "One integer polynomial gives the affine point count over every finite field. Proved as Kontsevich.kontsevich_seriesParallel."
    - source: "Banana graphs (Aluffi–Marcolli 2011, Corollary 5.6)"
      lean: "KontsevichChallenge.banana_count"
      module: "ChallengeKontsevich"
      status: proved
      note: "Exact affine count, multiplied by q. Proved as Kontsevich.banana_count."
    - source: "K4 = the wheel with three spokes (Stembridge; Brown–Schnetz)"
      lean: "KontsevichChallenge.k4_count"
      module: "ChallengeKontsevich"
      status: proved
      note: "q^2 (q^3 + q - 1) points. Proved as Kontsevich.k4_count."


  - title: "Ueber die Auflösung der Gleichungen, auf welche man bei der Untersuchung der linearen Vertheilung galvanischer Ströme geführt wird"
    authors:
      - "Gustav Kirchhoff"
    id: "doi:10.1002/andp.18471481202"
    type: paper
    location: "Annalen der Physik und Chemie 72 (1847), 497-508"
    relationship: background
    license: "public domain"
    author_endorsement: "n/a"
    note: "Origin of the spanning-tree polynomial in electrical networks; background for the electrical reading of Phi/Psi."
  - title: "mathlib4: the Lean mathematical library"
    authors:
      - "The Mathlib Community"
    id: "https://github.com/leanprover-community/mathlib4"
    type: other
    location: "Mathlib v4.35.0, as pinned by lakefile.toml and lake-manifest.json"
    relationship: background
    license: "Apache-2.0"
    author_endorsement: "n/a"

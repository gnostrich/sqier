related_formalizations:
  - id: "PALOMAR-2026-10-17-000013"
    relationship: other
    note: >-
      Growth series of the triangle Coxeter groups (p, q, infinity): an
      explicit rational identity for a specific family, proved there
      directly. This entry proves the general rationality theorem for monoids
      with a finite complete rewriting system (with respect to normal-form
      length) and does not reuse it.
  - id: "PALOMARSQUIERID"
    relationship: builds-on
    note: >-
      The Squier entry from this repository (Squier's theorem on finite
      derivation type). This entry reuses its definitions of rewriting
      steps, termination and confluence, and its critical pair lemma and S3
      system in the proofs of the examples.

status:
  scope: >-
    Formalized: exactly the seven statements listed in comparator-growth.json
    and stated in ChallengeGrowth.lean, with sorry-free proofs in Squier/
    (Transfer.lean, Growth.lean, building on the Squier development). All
    are unconditional apart from the stated hypotheses (finite alphabet;
    finite, terminating, confluent system).

    Not claimed. The growth series with respect to geodesic (shortest-word)
    length for arbitrary complete systems; growth series of groups (as
    opposed to monoids); Anick's resolution and homological results;
    automaticity. The results are classical; priority among formalizations
    is unknown. Proof terms were not reviewed line by line by a human; see
    the review block.

    Sorry and native_decide. The development is sorry-free and
    native_decide-free, and the compared theorems depend only on propext,
    Classical.choice and Quot.sound. ChallengeGrowth.lean's seven deliberate
    sorries are the comparator placeholders and are not counted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        From the author's brief, Claude (Anthropic) fixed the definitions and
        Lean statements, wrote ChallengeGrowth.lean, SolutionGrowth.lean,
        comparator-growth.json and this file, and checked the statement
        surface with lake comparator against sorried interfaces. Two
        parallel Claude agents wrote the proofs (the transfer-matrix
        rationality theorem; the normal-form bridge to PresentedMonoid and
        the examples) by iterating against the Lean compiler on the pinned
        toolchain.
      cost:
        wall_time: "about one hour"
        spend_usd: "not tracked"
        hardware: "cloud container, 4 cores"
      prompting_notes: >-
        Work was posed as written targets with fixed signatures, a short
        mathematical route per agent, and the axiom budget (propext,
        Quot.sound, Classical.choice only; no sorry, no native_decide).
    - method: manual
      models: []
      framework: "n/a"
      tool_setup: >-
        The human author chose the target as the analytic counterpart of
        Squier's theorem, wrote the brief with the statements and examples,
        and takes responsibility for all claims.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human conception and brief; AI-designed statements and AI-written Lean
    proofs (Claude). No human has reviewed the proof terms line by line. The
    trust model is Lean's kernel plus the axiom audit and the comparator
    check described under review.

fidelity:
  divergences: >-
    Between the repository and ChallengeGrowth.lean, which is what Palomar
    compares: ChallengeGrowth.lean imports only Mathlib and contains verbatim
    copies of the definitions it uses from Squier/Defs.lean and
    Squier/GrowthDefs.lean (namespace Squier); the statements are in the
    namespace SquierGrowthChallenge. There are no individual statement
    deviations.

    Against the sources: the growth series is defined by normal-form length
    (the number of monoid elements whose normal form has length n), not by
    the word metric with respect to the generators; the two agree for
    length-reducing or shortlex-compatible complete systems, including both
    examples, but the general geodesic statement is not claimed.
    Rationality is expressed as Q * f = P in Z[[X]] with Q(0) = 1, which is
    equivalent to an eventual linear recurrence with constant integer
    coefficients. The monoid is Mathlib's PresentedMonoid with relations
    l = r for the rules (l, r).

review:
  status: >-
    self-assessed; automated mechanical checks (lake build with sorry
    census; lake comparator from the pinned Lean v4.35.0 toolchain with
    statement match and replay through Lean's kernel, NanoDa and con-ron);
    no line-by-line human review of proof terms; no external mathematical
    peer review
  reviewers:
    - "Rohan Badade (self)"
  notes: >-
    Checked mechanically: lake build with no sorry warnings and no errors;
    #print axioms on every compared theorem (propext, Classical.choice,
    Quot.sound); and lake comparator with comparator-growth.json against
    ChallengeGrowth.lean, covering statement match, definition identity, the
    axiom allowlist and kernel replay. Checked by hand before formalization:
    the normal forms and growth series of the two examples. Not done:
    line-by-line human reading of proof terms; external mathematical review.

alignment:
  namespace: "SquierGrowthChallenge"
  statements:
    - source: "Transfer-matrix method (Stanley, EC1); words avoiding finitely many factors"
      lean: "SquierGrowthChallenge.avoidCount_rational"
      module: "ChallengeGrowth"
      status: proved
      note: "The number of words of length n avoiding a finite set of factors has a rational generating function. Proved as Squier.avoidCount_rational."
    - source: "Unique normal forms of a convergent rewriting system"
      lean: "SquierGrowthChallenge.unique_normalForm"
      module: "ChallengeGrowth"
      status: proved
      note: "Every element of PresentedMonoid has exactly one normal-form representative. Proved as Squier.unique_normalForm."
    - source: "Normal forms are the words avoiding left-hand sides"
      lean: "SquierGrowthChallenge.growth_eq_avoidCount"
      module: "ChallengeGrowth"
      status: proved
      note: "Elements with a normal form of length n correspond to words of length n avoiding every left-hand side. Proved as Squier.growth_eq_avoidCount."
    - source: "Rationality of growth series of monoids with finite complete rewriting systems (cf. Anick 1986)"
      lean: "SquierGrowthChallenge.growth_rational"
      module: "ChallengeGrowth"
      status: proved
      note: "With respect to normal-form length (see fidelity). Proved as Squier.growth_rational."
    - source: "Worked example: S3"
      lean: "SquierGrowthChallenge.s3_growth"
      module: "ChallengeGrowth"
      status: proved
      note: "Growth series 1 + 2z + 2z^2 + z^3. Proved as Squier.s3_growth."
    - source: "Worked example: S3"
      lean: "SquierGrowthChallenge.s3_card"
      module: "ChallengeGrowth"
      status: proved
      note: "The presented monoid has six elements. Proved as Squier.s3_card."
    - source: "Worked example: the free commutative monoid on two generators"
      lean: "SquierGrowthChallenge.comm2_growth"
      module: "ChallengeGrowth"
      status: proved
      note: "n + 1 elements of length n, i.e. 1/(1 - z)^2. Proved as Squier.comm2_growth."


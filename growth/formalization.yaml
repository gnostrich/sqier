# formalization.yaml v0.4. Second Palomar entry from this repository (growth series).
# Comparator configuration: comparator-growth.json.
version: "v0.4"

project:
  name: "Growth series of monoids with a finite complete rewriting system are rational: words avoiding finitely many factors, unique normal forms in the presented monoid, and the examples S3 and the free commutative monoid"
  description: >-
    A finite terminating and confluent string rewriting system presents a
    monoid in which every element has a unique normal form, and the normal
    forms are exactly the words that contain no left-hand side of a rule as
    a factor. Counting normal forms by length therefore reduces the growth
    of the monoid to a regular-language count. This entry proves in Lean 4
    and Mathlib that such counts have rational generating functions, and
    derives rationality of the growth series. Seven statements are compared.

    (1) For a finite set F of words over a finite alphabet, the number a(n)
    of words of length n containing no element of F as a factor has a
    rational generating function: Q * sum a(n) X^n = P in Z[[X]] for
    integer polynomials P, Q with Q(0) = 1. The proof is the transfer-matrix
    method (a(n + k) = u . M^n v for a matrix indexed by words of length k)
    followed by the Cayley–Hamilton theorem. (2) For a terminating,
    confluent system R, every element of the monoid presented by R
    (Mathlib's PresentedMonoid, the quotient of the free monoid by the
    congruence generated by the rules) has exactly one normal-form
    representative; the proof identifies that congruence with the
    equivalence generated by rewriting steps. (3) The number of monoid
    elements with a normal form of length n equals the number of words of
    length n avoiding every left-hand side. (4) Hence the growth series of
    the monoid with respect to normal-form length is rational.
    (5)-(6) For the complete system aa -> e, bb -> e, bab -> aba of the
    symmetric group S3, the growth series is 1 + 2z + 2z^2 + z^3 and the
    presented monoid has six elements. (7) For ba -> ab, presenting the
    free commutative monoid on two generators, there are n + 1 elements of
    length n, the series 1/(1 - z)^2.

    The growth series is taken with respect to the length of normal forms.
    For length-reducing or shortlex-compatible complete systems, such as
    the two examples, this coincides with the usual growth series with
    respect to the generators; in general the two may differ, and the
    general geodesic growth series is not claimed. The results are classical
    (transfer-matrix method; Anick 1986 for complete rewriting systems).
    SEARCHSENTENCE
  authors:
    - "Rohan Badade"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Rohan Badade"

